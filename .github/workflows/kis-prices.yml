name: KR 주식 실시간가 수집 → Firebase

on:
  schedule:
    # KST 09:00-15:30 = UTC 00:00-06:30 / 10분마다 / 월-금
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: read

jobs:
  fetch-kr-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Fetch KR prices → Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KIS_APP_KEY:               ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:            ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/fetch_kr_prices.py

      - name: Done
        run: echo "✅ KR 가격 수집 완료 $(date +'%Y-%m-%d %H:%M UTC')"
