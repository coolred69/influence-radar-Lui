name: Indicator Lab — 실데이터 백테스트 + 지표 진화

on:
  workflow_dispatch:        # 수동 실행
  schedule:
    - cron: '0 1 * * 0'    # 매주 일요일 KST 10:00 (UTC 01:00)

permissions:
  contents: write           # 결과 파일 자동 커밋

jobs:
  run-indicator-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy scipy

      - name: Step 1 — 실데이터 수집 (build_training_data.py)
        run: |
          mkdir -p data
          python scripts/build_training_data.py
          echo "✅ training_data.json 생성 완료"

      - name: Step 2 — 지표 진화 Gen 1 (indicator_lab.py)
        run: python scripts/indicator_lab.py

      - name: Step 3 — 지표 진화 Gen 2
        run: python scripts/indicator_lab.py

      - name: Step 4 — 지표 진화 Gen 3
        run: python scripts/indicator_lab.py

      - name: Step 5 — 지표 진화 Gen 4
        run: python scripts/indicator_lab.py

      - name: Step 6 — 지표 진화 Gen 5
        run: python scripts/indicator_lab.py

      - name: 결과 요약
        run: |
          echo "=== indicator_results.json 요약 ==="
          python -c "
          import json
          with open('data/indicator_results.json') as f:
              d = json.load(f)
          print(f'Generation: {d[\"generation\"]}')
          print(f'활성 지표: {len(d[\"active_indicators\"])}개')
          print(f'정확도: {d[\"optimal_metrics\"][\"accuracy\"]}%')
          print(f'AUC: {d[\"optimal_metrics\"][\"auc\"]}')
          print(f'Sharpe: {d[\"optimal_metrics\"][\"sharpe\"]}')
          print('최적 가중치 (상위 5):')
          w = sorted(d['optimal_weights'].items(), key=lambda x:-x[1])[:5]
          labels = d.get('indicator_labels', {})
          for k,v in w:
              print(f'  {labels.get(k,k)}: {v:.4f}')
          "

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training_data.json data/indicator_results.json
          git diff --cached --quiet || git commit -m "🤖 Indicator Lab 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
