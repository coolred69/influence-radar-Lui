name: 파라미터 최적화 — Phase 2

on:
  workflow_dispatch:
  schedule:
    # 매월 1일 KST 03:00 (UTC 18:00 전날)
    - cron: '0 18 1 * *'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install yfinance pandas numpy scipy

      - name: 파라미터 최적화 실행
        run: |
          mkdir -p data
          python scripts/optimize_params.py

      - name: 결과 출력
        run: |
          python -c "
          import json
          with open('data/optimal_params.json') as f:
              d = json.load(f)
          print(f'최적화 완료  AUC: {d[\"best_auc\"]}  이벤트: {d[\"event_count\"]}건')
          print()
          print('--- 최적 파라미터 ---')
          defaults = d['default_params']
          for k, v in d['best_params'].items():
              tag = ' ← 변경' if v != defaults.get(k) else ''
              print(f'  {k:<20}: {v}{tag}')
          "

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/optimal_params.json
          git diff --cached --quiet || git commit -m "🔬 파라미터 최적화 $(date +'%Y-%m-%d')"
          git push
