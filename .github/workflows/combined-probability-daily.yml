name: US+KR 종합확률 테이블 자동 갱신

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Signal Engine — 매수 신호 자동 생성"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-combined-table:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (최신 main — signals.json 반영)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run 종합확률 테이블 생성
        run: python scripts/build_combined_probability.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/combined_probability_table.json
          git diff --cached --quiet || git commit -m "종합확률 테이블 자동 갱신 $(date +'%Y-%m-%d')"
          git push
