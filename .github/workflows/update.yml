name: Influence Radar 3.0 - Daily Update

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 0시)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-day:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      is_sunday: ${{ steps.day.outputs.is_sunday }}
    steps:
      - name: Check if today is Sunday (UTC)
        id: day
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "is_sunday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_sunday=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy pandas

      - name: Train ML Model
        run: python3 scripts/train_model.py

      - name: Run Backtest
        run: python3 scripts/backtest.py

      - name: Generate Predictions
        run: python3 scripts/predict.py

      - name: Update Dashboard Data
        run: echo "Dashboard data updated at $(date)" > data/last_update.txt

      - name: Commit and Push
        run: |
          git config --local user.email "radar-ml@github.com"
          git config --local user.name "Radar ML Bot"
          git add -A
          git commit -m "chore: daily ML model update & backtest - $(date +'%Y-%m-%d %H:%M')" || true
          git fetch origin main
          git merge -X ours --no-edit origin/main || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  weekly-retrain:
    runs-on: ubuntu-latest
    needs: [update, check-day]
    # 일요일(UTC 기준)에만 전체 재학습 — check-day 잡의 실측 요일로 판정 (기존 run_attempt 조건은 매일 true라 사실상 매일 실행되던 버그)
    if: needs.check-day.outputs.is_sunday == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy pandas

      - name: Full Retraining (weekly)
        run: |
          python3 scripts/train_model.py
          python3 scripts/backtest.py

      - name: Commit retrained models
        run: |
          git config --local user.email "radar-ml@github.com"
          git config --local user.name "Radar ML Bot"
          git add -A
          git commit -m "chore: weekly full retrain - $(date +'%Y-%m-%d')" || true
          git fetch origin main
          git merge -X ours --no-edit origin/main || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
