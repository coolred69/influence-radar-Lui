name: 주간 펀더멘털 갱신 (US FMP + KR DART)

on:
  workflow_dispatch:
  schedule:
    # KST 매주 일요일 09:00 = UTC 토요일 00:00
    - cron: '0 0 * * 6'

permissions:
  contents: write

jobs:
  update-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Run US fundamentals (FMP)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/build_fundamental_us.py

      - name: Run KR fundamentals (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_fundamental_kr.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamental_us.json data/fundamental_kr.json
          git diff --cached --quiet || git commit -m "주간 펀더멘털 자동 갱신 $(date +'%Y-%m-%d')"
          git push
